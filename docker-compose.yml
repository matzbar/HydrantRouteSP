# Sobe app + MongoDB localmente ou em uma VPS:  docker compose up -d --build
# Acesse http://localhost:8000 (ou PORT=8080 docker compose up -d para mudar a porta)
services:
  app:
    build: .
    ports:
      - "${PORT:-8000}:8000"
    environment:
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: hydrantroute
      # Mapa de fundo: passe a chave ao subir (MAPTILER_KEY=... docker compose up -d); sem ela, OpenStreetMap.
      MAPTILER_KEY: ${MAPTILER_KEY:-}
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  mongo-data:
